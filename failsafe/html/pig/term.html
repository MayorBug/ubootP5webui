<!DOCTYPE html>
<html lang="en">
<head>
 <script>
 (function(){
  window.addEventListener('error',function(event){
   var target=event.target;
   if(!target || (target.tagName!=='SCRIPT' && !(target.tagName==='LINK' && target.rel==='stylesheet')))return;
   function notice(){
    if(!document.body || document.getElementById('resource-error'))return;
    var box=document.createElement('div');box.id='resource-error';box.setAttribute('role','alert');
    box.style.cssText='position:relative;padding:16px;margin:12px;background:#fff;color:#111;font:16px sans-serif;border:2px solid #b00020;z-index:9999';
    box.textContent='Page resources did not load. Reload this page. ';
    var button=document.createElement('button');button.textContent='Reload';button.onclick=function(){location.reload();};
    box.appendChild(button);document.body.prepend(box);
   }
   if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',notice,{once:true});else notice();
  },true);
 })();
 </script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-i18n="终端变量">Terminal &amp; environment</title>
	<script src="i18n.js?v=r6"></script>
	<script src="common.js?v=r4"></script>
	<link rel="stylesheet" href="style.css?v=r6">
</head>
<body class="iframe-content">
	<div class="card">
		<h2><svg class="icon" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-terminal"/></svg><span data-i18n="终端变量">终端变量</span></h2>
		<div class="terminal-container">
			<a href="term.html" target="_blank" class="terminal-expand" id="expandBtn" title="独立窗口打开" data-i18n-title="独立窗口打开">⧉</a>
			<div class="terminal-output-wrapper">
				<div class="terminal-output" id="terminalOutput"></div>
				<span class="terminal-status-bottom" id="connectionStatus">✗</span>
			</div>
			<div class="terminal-input-line">
				<span class="terminal-prompt">></span>
				<input type="text" class="terminal-input" id="terminalInput" placeholder="输入命令或变量名" data-i18n-placeholder="输入命令或变量名" autofocus>
				<button class="terminal-btn" id="sendBtn"><span data-i18n="发送">发送</span></button>
				<button class="terminal-btn" id="abortBtn"><span data-i18n="中断">中断</span></button>
				<button class="terminal-btn terminal-clear" id="clearBtn"><span data-i18n="清屏">清屏</span></button>
				<button class="terminal-btn active" id="rebootDev"><span data-i18n="重启">重启</span></button>
				<button class="terminal-btn active" id="envToggle"><span data-i18n="折叠">折叠</span></button>
				<div class="terminal-dropdown-menu" id="envMenu">
					<button class="terminal-btn active" id="queryEnv"><span data-i18n="查询">查询</span></button>
					<button class="terminal-btn" id="updateEnv"><span data-i18n="修改">修改</span></button>
					<button class="terminal-btn" id="deleteEnv"><span data-i18n="删除">删除</span></button>
					<button class="terminal-btn active" id="resetEnv"><span data-i18n="重置">重置</span></button>
				</div>
			</div>
		</div>
	</div>
	<script>
(function () {
	var URL = {
		STATUS: '/webterm/status',
		DATA: '/webterm/data',
		CMD: '/webterm/cmd',
		ABORT: '/webterm/abort',
		RESET: '/webterm/reset'
	};
	var POLL_INTERVAL = 500;
	var POLL_FAST = 100;
	var FETCH_OPTS = { cache: 'no-cache', headers: { 'Cache-Control': 'no-cache' } };
	var CMD_HEADERS = { 'Content-Type': 'text/plain' };

	var [terminalOutput, terminalInput, sendBtn, clearBtn, connectionStatus, abortBtn] =
		['terminalOutput', 'terminalInput', 'sendBtn', 'clearBtn', 'connectionStatus', 'abortBtn'].map(document.getElementById, document);

	var pollTimer = null;
	var lastSeq = 0;
	var stopped = false;
	var pollController = new AbortController();
	FETCH_OPTS.signal = pollController.signal;
	window.addEventListener('pagehide', function() {
		stopped = true; clearTimeout(pollTimer); pollController.abort();
	});
	window.addEventListener('pageshow', function(e) {
		if (!e.persisted) return;
		stopped = false; pollController = new AbortController();
		FETCH_OPTS.signal = pollController.signal; restartPollFast();
	});

	function postCommand(body) {
		return fetch(URL.CMD, { method: 'POST', headers: CMD_HEADERS, body: body });
	}

	function restartPoll(delay) {
		if (stopped) return;
		clearTimeout(pollTimer);
		pollTimer = setTimeout(fetchStatus, delay);
	}

	function restartPollFast() {
		restartPoll(POLL_FAST);
	}

	function postAndPoll(cmd) {
		postCommand(cmd);
		restartPollFast();
	}

	function getInput() {
		return terminalInput.value.trim();
	}

	async function fetchStatus() {
		if (stopped) return;
		var ok = false, hasNewData = false;
		try {
			var response = await fetch(URL.STATUS, FETCH_OPTS);
			if (response.ok) {
				var seq = parseInt(await response.text(), 10);
				if (seq !== lastSeq) {
					await fetchOutput();
					lastSeq = seq;
					hasNewData = true;
				}
				ok = true;
			}
		} catch (error) {}
		connectionStatus.textContent = ok ? '✓' : '✗';
		connectionStatus.style.color = ok ? 'green' : 'red';
		restartPoll(hasNewData ? POLL_FAST : POLL_INTERVAL);
	}

	async function fetchOutput() {
		try {
			var response = await fetch(URL.DATA + '?since=' + lastSeq, FETCH_OPTS);
			var text = await response.text();
			if (text) {
				terminalOutput.textContent += text;
				terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
			}
		} catch (error) {}
	}

	async function sendCommand() {
		var command = terminalInput.value.trim();
		if (!command) return;
		[terminalInput, sendBtn].forEach(function (el) { el.disabled = true; });
		try {
			await postCommand(command);
			terminalInput.value = '';
			restartPollFast();
		} catch (error) { } finally {
			[terminalInput, sendBtn].forEach(function (el) { el.disabled = false; });
			terminalInput.focus();
			updateButtonStyles();
		}
	}

	function clearTerminal() {
		terminalOutput.textContent = '';
		fetch(URL.RESET, { method: 'POST', headers: CMD_HEADERS }).catch(function() {});
		updateButtonStyles();
	}

	var updateEnv = document.getElementById('updateEnv');
	var deleteEnv = document.getElementById('deleteEnv');

	function updateButtonStyles() {
		var hasInput = terminalInput.value.trim().length > 0;
		[sendBtn, updateEnv, deleteEnv].forEach(function (el) {
			el.classList.toggle('active', hasInput);
		});
		clearBtn.classList.toggle('active', terminalOutput.textContent.trim().length > 0);
	}

	function abortCommand() {
		fetch(URL.ABORT, { method: 'POST', headers: CMD_HEADERS }).catch(function() {});
		restartPollFast();
	}

	terminalInput.addEventListener('input', updateButtonStyles);
	terminalInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') sendCommand(); });
	sendBtn.addEventListener('click', sendCommand);
	clearBtn.addEventListener('click', clearTerminal);
	abortBtn.addEventListener('click', abortCommand);

	document.getElementById('rebootDev').addEventListener('click', function () {
		if (confirm(uiText("确认重启？"))) { postCommand('reset'); }
	});

	var expandBtn = document.getElementById('expandBtn');
	var isFrame = window.self !== window.top;
	expandBtn.href = isFrame ? 'term.html' : 'index.html';
	expandBtn.target = isFrame ? '_blank' : '';
	expandBtn.removeAttribute('data-i18n-title');
	expandBtn.title = isFrame ? uiText("大窗") : uiText("返回");

	var envMenu = document.getElementById('envMenu');
	envMenu.classList.add('show');

	var envToggle = document.getElementById('envToggle');
	envToggle.textContent = uiText("折叠");

	envToggle.addEventListener('click', function () {
		envToggle.textContent = envMenu.classList.toggle('show') ? uiText("折叠") : uiText("展开");
	});

	document.getElementById('queryEnv').addEventListener('click', function () {
		var n = getInput();
		postAndPoll(n ? 'printenv ' + n : 'printenv');
	});

	document.getElementById('updateEnv').addEventListener('click', function () {
		var n = getInput();
		if (!n) { alert(uiText("输入变量名")); return; }
		var v = prompt(uiText('修改 {name} 的值:', {name:n}));
		if (v !== null) { postAndPoll('setenv ' + n + ' ' + v + '; saveenv'); }
	});

	document.getElementById('deleteEnv').addEventListener('click', function () {
		var n = getInput();
		if (!n) { alert(uiText("输入变量名")); return; }
		if (confirm(uiText('确认删除 {name}？', {name:n}))) { postAndPoll('setenv ' + n + '; saveenv'); }
	});

	document.getElementById('resetEnv').addEventListener('click', function () {
		var n = getInput();
		var msg = n ? uiText('将 {name} 重置为缺省值？', {name:n}) : uiText("重置全部为缺省值？");
		var cmd = n ? 'env default -f ' + n + '; saveenv' : 'env default -a; saveenv';
		if (confirm(msg)) { postAndPoll(cmd); }
	});

	restartPollFast();
})();
	</script>
</body>
</html>
