<!DOCTYPE html>
<html lang="en">
<head>
 <script>
 (function(){
  window.addEventListener('error',function(event){
   var target=event.target;
   if(!target || (target.tagName!=='SCRIPT' && !(target.tagName==='LINK' && target.rel==='stylesheet')))return;
   function notice(){
    if(!document.body || document.getElementById('resource-error'))return;
    var box=document.createElement('div');box.id='resource-error';box.setAttribute('role','alert');
    box.style.cssText='position:relative;padding:16px;margin:12px;background:#fff;color:#111;font:16px sans-serif;border:2px solid #b00020;z-index:9999';
    box.textContent='Page resources did not load. Reload this page. ';
    var button=document.createElement('button');button.textContent='Reload';button.onclick=function(){location.reload();};
    box.appendChild(button);document.body.prepend(box);
   }
   if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',notice,{once:true});else notice();
  },true);
 })();
 </script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-i18n="U-BOOT控制台">P5 recovery</title>
	<script src="i18n.js?v=r6"></script>
	<script src="common.js?v=r4"></script>
	<link rel="stylesheet" href="style.css?v=r6">
</head>
<body>
	<div class="main-container">
		<aside class="sidebar">
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item active"><a href="recovery.html" target="content-frame" data-i18n="P5 recovery">P5 recovery</a></li>
				<li class="sidebar-nav-item"><a href="backup.html" target="content-frame" data-i18n="Back up partitions">Back up partitions</a></li>
				<li class="sidebar-nav-item"><a href="recovery.html#boot" target="content-frame" data-i18n="Boot / Flash OpenWrt">Boot / Flash OpenWrt</a></li>
				<li class="sidebar-nav-item"><a href="recovery.html#layout" target="content-frame" data-i18n="Change flash layout">Change flash layout</a></li>
				<li class="sidebar-nav-item"><a href="recovery.html#restore" target="content-frame" data-i18n="Restore partitions">Restore partitions</a></li>
				<li class="sidebar-nav-item"><a href="recovery.html#install" target="content-frame" data-i18n="Test / Flash U-boot">Test / Flash U-boot</a></li>
				<li class="sidebar-nav-item"><a href="about.html" target="content-frame" data-i18n="Board information">Board information</a></li>
				<li class="sidebar-nav-item"><a href="term.html" target="content-frame" data-i18n="Terminal">Terminal</a></li>
				<li class="sidebar-nav-item"><a href="javascript:void(0)" id="rebootBtn" data-i18n="重启设备">重启设备</a></li>
			</ul>
			<div class="language-switch"><label for="language-picker" data-i18n="语言">语言</label> <select id="language-picker"><option value="en" lang="en">English</option><option value="zh" lang="zh-CN">简体中文</option></select></div>
			<div class="theme-switch"><span data-i18n="主题 |">主题 |</span> <span id="themeSwitch">亮☀</span></div>
		</aside>
		<div class="content-frame-wrapper">
			<iframe name="content-frame" id="content-frame" src="recovery.html" title="内容区域" data-i18n-title="内容区域" class="content-frame"></iframe>
		</div>
	</div>
	<div class="additional-links">
		<p class="link-tip"><span data-i18n="获取更多信息:">获取更多信息:</span><a href="https://github.com/MayorBug/ubootP5webui" target="_blank">GitHub</a> | <span id="uboot-version"></span></p>
	</div>
	<script>
		(function () {
			var frame = document.getElementById('content-frame');
			var languagePicker = document.getElementById('language-picker');
			languagePicker.value = uiLanguage;
			languagePicker.onchange = function() {
				changeUiLanguage(this.value);
				this.value = uiLanguage;
			};
			var items = document.querySelectorAll('.sidebar-nav-item');
			var links = document.querySelectorAll('.sidebar-nav-item a');
			links.forEach(function (a) {
				a.addEventListener('click', function (event) {
					if (uiWorkBusy()) { event.preventDefault(); return; }
					if (a.id === 'rebootBtn') return;
					items.forEach(function (li) { li.classList.remove('active'); });
				a.parentElement.classList.add('active');
				});
			});
			frame.addEventListener('load', function () {
				try {
					frame.contentWindow.setUiBusy(!!frame.contentWindow.uiBusy);
					var title = frame.contentDocument.title;
					if (title) document.title = title;
				} catch (e) {}
			});

			var saved = '';
			try { saved = localStorage.getItem('theme') || ''; } catch (e) {}
			if (saved) document.documentElement.setAttribute('data-theme', saved);
			document.documentElement.classList.add('no-transition');
			requestAnimationFrame(function() {
				requestAnimationFrame(function() {
					document.documentElement.classList.remove('no-transition');
				});
			});

			function apply(el, v) {
				v ? el.setAttribute('data-theme', v) : el.removeAttribute('data-theme');
			}

			function syncTheme() {
				var theme = document.documentElement.getAttribute('data-theme') || '';
				try { apply(frame.contentDocument.documentElement, theme); } catch (e) {}
				try { frame.contentWindow.postMessage({type: 'theme', theme: theme}, '*'); } catch (e) {}
			}

			var themeSw = document.getElementById('themeSwitch');
			window.addEventListener('uilanguagechange', function() {
				themeSw.textContent = uiText(document.documentElement.getAttribute('data-theme') === 'light' ? '暗☾' : '亮☀');
			});
			themeSw.addEventListener('click', function () {
				var theme = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
				document.documentElement.classList.add('no-transition');
				try { frame.contentDocument.documentElement.classList.add('no-transition'); } catch (e) {}
				apply(document.documentElement, theme);
				try { localStorage.setItem('theme', theme); } catch (e) {}
				themeSw.textContent = theme === 'light' ? uiText("暗☾") : uiText("亮☀");
				syncTheme();
				requestAnimationFrame(function () {
					requestAnimationFrame(function () {
						document.documentElement.classList.remove('no-transition');
						try { frame.contentDocument.documentElement.classList.remove('no-transition'); } catch (e) {}
					});
				});
			});

			frame.addEventListener('load', syncTheme);
			syncTheme();

			window.addEventListener('DOMContentLoaded', function() { window.dispatchEvent(new Event('uilanguagechange')); });

			document.getElementById('rebootBtn').addEventListener('click', function () {
				if (uiWorkBusy()) return;
				if (confirm(uiText("确认重启？"))) {
					fetch('/webterm/cmd', {method:'POST',headers:{'Content-Type':'text/plain'},body:'reset'});
					try{frame.contentWindow.showStep(3,uiText("设备重启中..."),3);frame.contentWindow.pingDevice(3)}catch(e){frame.src='update.html#reboot'}
				}
			});

			function refreshVersion() {
				xhrGet('/about', function(data) {
					var el = document.getElementById('uboot-version');

					if (el && data && data.version)
						el.textContent = 'Version: ' + data.version;
				});
			}
			frame.addEventListener('load', refreshVersion);
			refreshVersion();
		})();
	</script>
</body>
</html>
