<html lang="en">
<head>
 <script>
 (function(){
  window.addEventListener('error',function(event){
   var target=event.target;
   if(!target || (target.tagName!=='SCRIPT' && !(target.tagName==='LINK' && target.rel==='stylesheet')))return;
   function notice(){
    if(!document.body || document.getElementById('resource-error'))return;
    var box=document.createElement('div');box.id='resource-error';box.setAttribute('role','alert');
    box.style.cssText='position:relative;padding:16px;margin:12px;background:#fff;color:#111;font:16px sans-serif;border:2px solid #b00020;z-index:9999';
    box.textContent='Page resources did not load. Reload this page. ';
    var button=document.createElement('button');button.textContent='Reload';button.onclick=function(){location.reload();};
    box.appendChild(button);document.body.prepend(box);
   }
   if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',notice,{once:true});else notice();
  },true);
 })();
 </script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Device information</title>
	<script src="i18n.js?v=r6"></script>
	<script src="common.js?v=r4"></script>

</head>
<body class="iframe-content">
	<script>if(window.self!==window.top)document.body.classList.add('in-frame')</script>
	<div class="card about-card">
		<h2 class="has-tabs"><svg class="icon" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-router"/></svg><span id="about-title"><span data-i18n="关于设置">关于设置</span></span><span class="tab-indicator" id="tab-indicator"></span></h2>

		<!-- 标签页导航 -->
		<div class="tab-nav">
			<div class="tab-item active" data-tab="info"><span data-i18n="设备信息">设备信息</span></div>
			<div class="tab-item" data-tab="gpio"><span data-i18n="GPIO信息">GPIO信息</span></div>
			<div class="tab-item" data-tab="smem"><span data-i18n="SMEM信息">SMEM信息</span></div>
			<div class="tab-item" data-tab="mac"><span data-i18n="MAC管理">MAC管理</span></div>
		</div>

		<div class="tab-container">
			<!-- 第1页：设备信息 -->
			<div class="tab-content active" id="tab-info">
				<div class="about-section">
					<table class="about-table" id="info-table">
						<tbody id="info-tbody"></tbody>
					</table>
				</div>
			</div>

			<!-- 第2页：GPIO信息 -->
			<div class="tab-content" id="tab-gpio">
				<div class="about-section">
					<table class="about-table" id="gpio-table">
						<thead><tr><th><span data-i18n="名称">名称</span></th><th><span data-i18n="映射">映射</span></th><th>GPIO</th><th><span data-i18n="方向">方向</span></th><th><span data-i18n="当前值">当前值</span></th><th><span data-i18n="电平">电平</span></th><th><span data-i18n="父系">父系</span></th><th><span data-i18n="来源">来源</span></th><th><span data-i18n="覆盖">覆盖</span></th><th><span class="about-gpio-ops"><span data-i18n="操作">操作</span> <button class="about-sm-btn" id="gpio-detect-btn"><span data-i18n="探测按键">探测按键</span></button></span></th></tr></thead>
						<tbody id="gpio-tbody"></tbody>
					</table>
					<p id="gpio-error" role="alert" hidden></p>
				</div>
			</div>

			<!-- 第3页：SMEM信息 -->
			<div class="tab-content" id="tab-smem">
				<div class="about-section">
					<table class="about-table" id="smem-table">
						<thead id="smem-thead"><tr><th rowspan="2"><span data-i18n="名称">名称</span></th><th colspan="2"><span data-i18n="起始">起始</span></th><th colspan="2"><span data-i18n="结束">结束</span></th><th colspan="3"><span data-i18n="大小">大小</span></th><th rowspan="2"><span data-i18n="指向">指向</span></th></tr><tr><th><span data-i18n="块">块</span></th><th><span data-i18n="地址">地址</span></th><th><span data-i18n="块">块</span></th><th><span data-i18n="地址">地址</span></th><th><span data-i18n="块数">块数</span></th><th>Hex</th><th><span data-i18n="容量">容量</span></th></tr></thead>
						<tbody id="smem-tbody"></tbody>
					</table>
				</div>
			</div>

			<!-- 第4页：MAC管理 -->
			<div class="tab-content" id="tab-mac">
				<div class="about-section">
					<p id="mac-source"></p>
					<p data-i18n="Calibration MACs can differ from active Wi-Fi MACs. Pass means the checksum is valid.">Calibration MACs can differ from active Wi-Fi MACs. Pass means the checksum is valid.</p>
					<table class="about-table" id="mac-table">
						<thead><tr><th><span data-i18n="接口">接口</span></th><th><span data-i18n="MAC地址">MAC地址</span></th><th><span data-i18n="ART偏移">ART偏移</span></th><th><span data-i18n="校验偏移">校验偏移</span></th><th><span data-i18n="XOR16值">XOR16值</span></th><th><span data-i18n="校验状态">校验状态</span></th><th><span data-i18n="操作">操作</span></th></tr></thead>
						<tbody id="mac-tbody"></tbody>
					</table>
				</div>
			</div>


		</div>
	</div>

	<script>
(function() {
	var ledTimers = {};

	function ledControl(name, action) {
		xhrGet('/led?name=' + encodeURIComponent(name) + '&action=' + action, function() {});
	}

	function startBlink(name) {
		if (ledTimers[name]) return;
		ledTimers[name] = setInterval(function() {
			ledControl(name, 'toggle');
		}, 500);
	}

	function stopBlink(name) {
		if (ledTimers[name]) {
			clearInterval(ledTimers[name]);
			delete ledTimers[name];
		}
	}

	function stopAllBlink() {
		Object.keys(ledTimers).forEach(stopBlink);
	}

	function mkBtn(text, attrs, style) {
		var b = document.createElement('button');
		b.textContent = text;
		b.className = 'about-sm-btn';
		for (var k in attrs) b.setAttribute(k, attrs[k]);
		if (style) for (var k in style) b.style[k] = style[k];
		return b;
	}

	function addBtn(parent, text, attrs, style, extra) {
		var b = mkBtn(text, attrs, style);
		if (extra) b.className += ' ' + extra;
		parent.appendChild(b);
		return b;
	}

	function gpioRequest(url, options, parent, done) {
		var controls = document.querySelectorAll('#gpio-tbody button, #gpio-tbody input');
		controls.forEach(function(c) { c.disabled = true; });
		var error = document.getElementById('gpio-error');
		error.hidden = true;
		fetch(url, options).then(function(r) {
			if (!r.ok) throw Error();
			return r.text();
		}).then(function(reply) {
			if (reply.trim() !== 'ok') throw Error();
			done();
		}).catch(function() {
			error.textContent = uiText('Action failed. Reload to check the current state before trying again.');
			error.hidden = false;
		}).then(function() { controls.forEach(function(c) { c.disabled = false; }); });
	}

	function addToggle(parent, label, on, change, enabledText) {
		var wrap = document.createElement('label');
		wrap.className = 'gpio-toggle';
		var input = document.createElement('input');
		input.type = 'checkbox'; input.setAttribute('role', 'switch'); input.checked = on;
		input.setAttribute('aria-label', label);
		var track = document.createElement('span'); track.className = 'gpio-toggle-track'; track.setAttribute('aria-hidden', 'true');
		var text = document.createElement('span');
		function render() { text.textContent = label + ': ' + uiText(input.checked ? (enabledText || 'On') : 'Off'); }
		render();
		input.onchange = function() {
			var next = input.checked; input.checked = !next;
			change(next, function() { input.checked = next; render(); });
		};
		wrap.appendChild(input); wrap.appendChild(track); wrap.appendChild(text); parent.appendChild(wrap);
	}

	function modemAction(action, parent, done) {
		if ((action === 'power-off' || action === 'reset') && !confirm(uiText('This interrupts the modem connection. Continue?'))) return;
		gpioRequest('/p5_modem', {method:'POST', headers:{'X-P5-Recovery':'1'}, body:action}, parent, done);
	}

	function bindLedButtons(gpioTbody) {
		gpioTbody.querySelectorAll('.about-sm-btn[data-act]').forEach(function(btn) {
			btn.addEventListener('click', function() {
				var name = this.getAttribute('data-led'), act = this.getAttribute('data-act');
				if (act === 'blink') {
					startBlink(name);
					this.style.display = 'none';
					var stopBtn = this.parentElement.querySelector('[data-act="stop"][data-led="' + name + '"]');
					stopBtn.style.display = '';
					stopBtn.classList.add('about-btn-pressed');
				} else {
					stopBlink(name);
					var stopBtn = this.parentElement.querySelector('[data-act="stop"][data-led="' + name + '"]'),
					    blinkBtn = this.parentElement.querySelector('[data-act="blink"][data-led="' + name + '"]');
					if (stopBtn) { stopBtn.style.display = 'none'; stopBtn.classList.remove('about-btn-pressed'); }
					if (blinkBtn) blinkBtn.style.display = '';
					ledControl(name, act);
				}
			});
		});

		gpioTbody.querySelectorAll('.about-blink-stop').forEach(function(btn) {
			btn.addEventListener('click', function() {
				var name = this.getAttribute('data-led');
				stopBlink(name);
				this.style.display = 'none';
				this.classList.remove('about-btn-pressed');
				var blinkBtn = this.parentElement.querySelector('[data-act="blink"][data-led="' + name + '"]');
				if (blinkBtn) blinkBtn.style.display = '';
				ledControl(name, 'off');
			});
		});
	}

	var infoFields = [
		[uiText("机型"), 'model'],
		[uiText("配置名称"), 'config_name'],
		[uiText("机型ID"), 'machid'],
		[uiText("内存大小"), 'ram_size'],
		[uiText("闪存类型"), 'flash_type'],
		[uiText("闪存信息"), 'flash_chips'],
		[uiText("PHY/交换机"), 'phy_switch_info'],
		[uiText("有线MAC"), 'mac_addr'],
		[uiText("无线MAC"), 'wifi_mac'],
		[uiText("U-Boot版本"), 'version']
	];

	function loadAbout() {
		var infoTbody = document.getElementById('info-tbody');
		infoTbody.innerHTML = '';
		infoFields.forEach(function(f) {
			var tr = document.createElement('tr');
			var td1 = document.createElement('td');
			td1.textContent = f[0];
			var td2 = document.createElement('td');
			td2.textContent = '-';
			td2.setAttribute('data-key', f[1]);
			tr.appendChild(td1);
			tr.appendChild(td2);
			infoTbody.appendChild(tr);
		});

		xhrGet('/about', function(data) {
			infoFields.forEach(function(f) {
				var key = f[1];
				var td = infoTbody.querySelector('[data-key="' + key + '"]');
				if (!td) return;
				var val = data[key] || '-';
				if (key === 'ram_size')
					val = data.ram_size ? formatSize(data.ram_size) : '-';
				if (key === 'flash_chips' && val !== '-')
					val = val.replace(/(\d+)MiB/g, function(m, n) { var g = parseInt(n) / 1024; return g >= 1 ? g.toFixed(2) + 'GiB' : m; });
				td.textContent = val;
				if (key === 'phy_switch_info' && val !== '-')
					td.innerHTML = val.replace(/([^,]+) \[UP\]/g, '<span style="color:#27ae60">$1</span>').replace(/ \[DOWN\]/g, '');
				if (key === 'config_name' && data.config_name_source) {
					td.className = 'about-gpio-ops';
					if (data.config_name_source === 'env') {
						addBtn(td, uiText("恢复")).onclick = function() { xhrPost('/env_set', 'config_name=', function() { loadAbout(); }); };
					} else if (data.config_name_source === 'fdt') {
						addBtn(td, uiText("修改")).onclick = function() {
							var v = prompt(uiText("输入 config_name 值 (如 config@xxx):"));
							if (v !== null && v !== '')
								xhrPost('/env_set', 'config_name=' + encodeURIComponent(v), function() { loadAbout(); });
						};
					}
				}
			});

			var gpioTbody = document.getElementById('gpio-tbody');
			gpioTbody.innerHTML = '';
			stopDetect();
			var stickyIdx = 0;
			(data.gpios || []).forEach(function(g) {
				var tr = document.createElement('tr'), isLed = g.parent === 'led_gpio',
				    opsTd = document.createElement('td');
				opsTd.className = 'about-gpio-ops';
				if (isLed) {
					addToggle(opsTd, g.name, !!g.value, function(on, done) {
						stopBlink(g.name);
						gpioRequest('/led?name=' + encodeURIComponent(g.name) + '&action=' + (on ? 'on' : 'off'), {}, opsTd, function() {
							done(); tr.cells[4].textContent = on ? 1 : 0;
							tr.cells[5].textContent = uiText(on ? '高' : '低');
						});
					});
					addBtn(opsTd, uiText("闪烁"), {'data-led':g.name, 'data-act':'blink'});
					addBtn(opsTd, uiText("停止"), {'data-led':g.name, 'data-act':'stop'}, {display:'none'}, 'about-blink-stop');
				}
				if (g.parent === 'modem_gpio' && g.gpio === 35) {
					g.name = 'modem-power';
					addToggle(opsTd, uiText('Power'), g.value === 0, function(on, done) {
						modemAction(on ? 'power-on' : 'power-off', opsTd, function() {
							done(); tr.cells[4].textContent = on ? 0 : 1;
							tr.cells[5].textContent = uiText(on ? '低' : '高');
						});
					});
					var boot = document.createElement('div'); boot.className = 'gpio-boot';
					addToggle(boot, uiText('Startup action'), data.p5_modem_boot === true, function(on, done) {
						modemAction(on ? 'boot-on' : 'boot-off', opsTd, done);
					});
					opsTd.appendChild(boot);
				}
				if (g.parent === 'modem_gpio' && g.gpio === 30) {
					addToggle(opsTd, uiText('Startup action'), data.p5_modem_reset_boot === true, function(on, done) {
						modemAction(on ? 'reset-boot-on' : 'reset-boot-off', opsTd, done);
					}, 'Reset');
					addBtn(opsTd, uiText('Reset modem')).onclick = function() { modemAction('reset', opsTd, function() { tr.cells[4].textContent = 0; tr.cells[5].textContent = uiText('低'); }); };
				}
				if (g.override) {
					addBtn(opsTd, uiText("恢复"), {'data-override': g.override});
				} else if (!isLed && g.parent === 'key_gpio') {
					addBtn(opsTd, uiText("修改"), {'data-modify': 'reset_key'});
				}
				if (!opsTd.hasChildNodes()) opsTd.textContent = '-';
				tr.innerHTML = [g.name||'-', g.alias||'', g.gpio, g.dir||'-',
					g.value, g.value?uiText("高"):uiText("低"), g.parent||'-',
					g.source==='env'?uiText("变量"):'fdt', g.override||''
				].map(function(v){return '<td>'+v+'</td>';}).join('');
				tr.appendChild(opsTd);
				if (opsTd.hasChildNodes() && opsTd.textContent !== '-') {
					tr.classList.add('gpio-btn-row');
					tr.style.top = (2 + stickyIdx * 2) + 'rem';
					stickyIdx++;
				}
				gpioTbody.appendChild(tr);
			});
			bindLedButtons(gpioTbody);
			gpioTbody.querySelectorAll('[data-override]').forEach(function(btn) {
				btn.onclick = function() {
					var key = this.getAttribute('data-override');
					xhrPost('/env_set', encodeURIComponent(key) + '=', function() { loadAbout(); });
				};
			});
			gpioTbody.querySelectorAll('[data-modify]').forEach(function(btn) {
				btn.onclick = function() {
					var key = this.getAttribute('data-modify'),
					    val = prompt(uiText('输入 {name} 的 GPIO 编号:', {name:key}));
					if (val !== null && val !== '')
						xhrPost('/env_set', encodeURIComponent(key) + '=' + encodeURIComponent(val), function() { loadAbout(); });
				};
			});
			var detectBtn = document.getElementById('gpio-detect-btn');
			detectBtn.onclick = function() {
				if (detectTimer) {
					stopDetect();
				} else {
					pollDetect();
					detectTimer = setInterval(pollDetect, 200);
					this.textContent = uiText("停止探测");
					this.classList.add('about-btn-pressed');
				}
			};

			xhrGet('/mac_info', function(md) {
				var wifiTd = infoTbody.querySelector('[data-key="wifi_mac"]');
				if (wifiTd) wifiTd.textContent = md.wifi_mac || '-';
			});
		});
	}

	function loadSmemTable() {
		xhrGet('/partitions', function(data) {
			var smemTbody = document.getElementById('smem-tbody');
			smemTbody.innerHTML = '';
			(data.parts || []).forEach(function(p) {
				var tr = document.createElement('tr');
				var blkStart = (p.blk_start !== undefined) ? p.blk_start : '-';
				var blkEnd = (p.blk_start !== undefined && p.blk_size !== undefined) ? (p.blk_start + p.blk_size - 1) : '-';
				var blkSize = (p.blk_size !== undefined) ? p.blk_size : '-';
				tr.innerHTML = '<td>' + (p.name||'-') + '</td>'
					+ '<td>' + blkStart + '</td><td>' + formatHex(p.start) + '</td>'
					+ '<td>' + blkEnd + '</td><td>' + formatHex(p.start+p.size) + '</td>'
					+ '<td>' + blkSize + '</td><td>' + p.size.toString(16).toUpperCase() + '</td><td>' + formatSize(p.size) + '</td>'
					+ '<td>' + (p.flash||'-') + '</td>';
				smemTbody.appendChild(tr);
			});
		});
	}

	function loadMacTable(data) {
		var macTbody = document.getElementById('mac-tbody');
		document.getElementById('mac-source').textContent = uiText(data.mac_editable === false ? 'Read only. MAC source:' : 'MAC source:') + ' ' + (data.mac_source || '');
		macTbody.innerHTML = '';
		var entries = [];
		var ethMacs = (data.mac_addr || '').split(', ');
		var ethOffs = (data.mac_off || '').split(', ');
		var wifiMacs = (data.wifi_mac || '').split(', ');
		var wifiOffs = (data.wifi_off || '').split(', ');
		var wifiCss = (data.wifi_cs || '').split(', ');
		var wifiCsOffs = (data.wifi_cs_off || '').split(', ');
		var wifiCsOks = (data.wifi_cs_ok || '').split(', ');
		for (var i = 0; i < ethMacs.length; i++)
			if (ethMacs[i]) entries.push({iface: 'eth' + i, mac: ethMacs[i], off: ethOffs[i] || 'N/A', cso: 'N/A', cs: 'N/A', ok: 'N/A'});
		for (var i = 0, j = 0; i < wifiMacs.length; i++)
			if (wifiMacs[i] && wifiMacs[i] !== '-') entries.push({iface: uiText('Calibration entry') + ' ' + i, mac: wifiMacs[i], off: wifiOffs[j] || '-', cso: wifiCsOffs[j] || '-', cs: wifiCss[j] || '-', ok: wifiCsOks[j++] === '1' ? uiText('Pass') : uiText('Fail')});
		entries.forEach(function(e) {
			var tr = macTbody.insertRow();
			['iface', 'mac', 'off', 'cso', 'cs', 'ok'].forEach(function(k) {
				tr.insertCell().textContent = e[k];
			});
			var tdO = tr.insertCell();
			tdO.className = 'about-gpio-ops';
			if (data.mac_editable === false) { tdO.textContent = uiText('仅供查看'); return; }
			var btn = addBtn(tdO, uiText("修改"));
			btn.setAttribute('data-iface', e.iface);
			btn.onclick = function() {
				var v = prompt(uiText('输入 {name} 的新MAC地址 (格式: XX:XX:XX:XX:XX:XX):', {name:e.iface}));
				if (!v) return;
				if (!/^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/.test(v)) return alert(uiText("MAC地址格式无效"));
				xhrPost('/mac_set', 'iface=' + encodeURIComponent(e.iface) + '&mac=' + encodeURIComponent(v.toUpperCase()), function(r) {
					if (r !== 'ok') return alert(uiText("修改失败"));
					xhrGet('/mac_info', function(d) {
						loadMacTable(d);
						var macTd = document.querySelector('[data-key="mac_addr"]');
						if (macTd) macTd.textContent = d.mac_addr || '-';
						var wifiTd = document.querySelector('[data-key="wifi_mac"]');
						if (wifiTd) wifiTd.textContent = d.wifi_mac || '-';
					});
				});
			};
		});
	}

	var detectTimer = null;
	var detectExtraRows = {};
	var detectPrev = {};

	function stopDetect() {
		if (detectTimer) {
			clearInterval(detectTimer);
			detectTimer = null;
		}
		Object.keys(detectExtraRows).forEach(function(gpio) {
			if (detectExtraRows[gpio].parentNode)
				detectExtraRows[gpio].parentNode.removeChild(detectExtraRows[gpio]);
		});
		detectExtraRows = {};
		detectPrev = {};
		var gpioTbody = document.getElementById('gpio-tbody');
		if (gpioTbody) gpioTbody.querySelectorAll('.about-row-changed').forEach(function(row) {
			row.classList.remove('about-row-changed');
		});
		var btn = document.getElementById('gpio-detect-btn');
		if (btn) {
			btn.textContent = uiText("探测按键");
			btn.classList.remove('about-btn-pressed');
		}
	}

	function pollDetect() {
		xhrGet('/btn_detect', function(data) {
			if (!data || !data.length) return;
			var gpioTbody = document.getElementById('gpio-tbody');
			data.forEach(function(b) {
				var changed = detectPrev[b.gpio] !== undefined && detectPrev[b.gpio] !== b.value;
				detectPrev[b.gpio] = b.value;
				var found = false;
				var rows = gpioTbody.querySelectorAll('tr');
				for (var r = 0; r < rows.length; r++) {
					var cells = rows[r].querySelectorAll('td');
					if (cells.length > 1 && cells[2].textContent == b.gpio) {
						cells[4].textContent = b.value;
						cells[5].textContent = b.value ? uiText("高") : uiText("低");
						cells[5].className = b.value ? '' : 'about-btn-pressed';
						if (changed) {
							rows[r].classList.add('about-row-changed');
							rows[r].scrollIntoView({behavior:'smooth',block:'nearest'});
						}
						found = true;
						break;
					}
				}
				if (!found && !detectExtraRows[b.gpio]) {
					var tr = document.createElement('tr');
					tr.innerHTML =
						'<td>-</td>' +
						'<td></td>' +
						'<td>' + b.gpio + '</td>' +
						'<td>in</td>' +
						'<td>' + b.value + '</td>' +
						'<td' + (b.value ? '' : ' class="about-btn-pressed"') + '>' + (b.value ? uiText("高") : uiText("低")) + '</td>' +
						'<td>-</td><td>-</td><td></td><td>-</td>';
					gpioTbody.appendChild(tr);
					detectExtraRows[b.gpio] = tr;
				}
				if (!found && detectExtraRows[b.gpio]) {
					var cells = detectExtraRows[b.gpio].querySelectorAll('td');
					cells[4].textContent = b.value;
					cells[5].textContent = b.value ? uiText("高") : uiText("低");
					cells[5].className = b.value ? '' : 'about-btn-pressed';
					if (changed) {
						detectExtraRows[b.gpio].classList.add('about-row-changed');
						detectExtraRows[b.gpio].scrollIntoView({behavior:'smooth',block:'nearest'});
					}
				}
			});
		});
	}


	var tabTitles = { info: uiText("设备信息"), gpio: uiText("GPIO信息"), smem: uiText("SMEM信息"), mac: uiText("MAC管理") };

	var macLoaded = false, smemLoaded = false;
	var titleEl = document.getElementById('about-title'), indicator = document.getElementById('tab-indicator');
	function switchTab(tabName) {
		if (!tabTitles[tabName]) tabName = 'info';
		try { history.replaceState(null, '', '#' + tabName); } catch (e) {}
		var tabs = document.querySelectorAll('.tab-item');
		var contents = document.querySelectorAll('.tab-content');

		tabs.forEach(function(tab) {
			tab.classList.toggle('active', tab.getAttribute('data-tab') === tabName);
		});

		contents.forEach(function(content) {
			content.classList.toggle('active', content.id === 'tab-' + tabName);
		});

		titleEl.textContent = tabTitles[tabName] || uiText("关于设置");
		document.title = tabTitles[tabName] || uiText("关于设置");

		if (tabName === 'mac' && !macLoaded) {
			macLoaded = true;
			xhrGet('/mac_info', loadMacTable);
		}
		if (tabName === 'smem' && !smemLoaded) {
			smemLoaded = true;
			loadSmemTable();
		}

		updateTabIndicator(indicator);
	}

	// 绑定标签页点击事件
	document.querySelectorAll('.tab-item').forEach(function(tab) {
		tab.addEventListener('click', function() {
			var tabName = this.getAttribute('data-tab');
			switchTab(tabName);
		});
	});

	window.addEventListener('pagehide', function() {
		stopAllBlink();
		if (detectTimer) clearInterval(detectTimer);
	});

	loadAbout();
	switchTab(location.hash.slice(1) || 'info');
	updateTabIndicator(indicator);
	window.addEventListener('resize', function() { updateTabIndicator(indicator); });
})();
	</script>
</body>
</html>
